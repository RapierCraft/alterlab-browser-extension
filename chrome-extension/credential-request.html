<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AlterLab - Credential request</title>
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; margin: 16px; max-width: 460px; background: #1c1917; color: #fafaf9; }
      code { background: #292524; padding: 1px 5px; border-radius: 4px; }
      label { display: block; margin: 8px 0 2px; }
      input { width: 100%; box-sizing: border-box; padding: 5px; background: #292524; color: #fafaf9; border: 1px solid #57534e; border-radius: 4px; }
      button { padding: 6px 12px; margin: 12px 8px 0 0; cursor: pointer; }
      #status { margin-top: 12px; }
    </style>
  </head>
  <body>
    <h3>Your agent needs a credential</h3>
    <p><strong id="agent">Your agent</strong> is asking for a credential for <code id="domain"></code>.</p>
    <ul>
      <li>Purpose: <span id="reason"></span></li>
      <li>Site: <code id="site"></code> (only this site)</li>
      <li>Retention: <span id="retention"></span></li>
      <li>Sealed in this browser before it is sent; AlterLab only stores ciphertext.</li>
    </ul>
    <form id="form" autocomplete="off">
      <label for="short_code">Short code (optional)</label>
      <input id="short_code" name="short_code" type="text" maxlength="16" />
      <div id="fields"></div>
      <button id="provide" type="submit">Seal and provide</button>
      <button id="decline" type="button">Decline</button>
      <button id="connect" type="button">Connect a session instead</button>
    </form>
    <p id="status" role="status"></p>
    <script src="hands-credentials.js"></script>
    <script src="credential-request.js"></script>
  </body>
</html>
