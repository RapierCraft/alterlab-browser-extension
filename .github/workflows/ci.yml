name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and parity tests
        run: npm run test:unit

      - name: Build both browsers
        run: npm run build

      - name: Lint the Firefox build
        run: npx --yes web-ext@10.8.0 lint --source-dir dist/firefox

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Chrome end-to-end smoke tests
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload Chrome build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-build
          path: dist/alterlab-connect-chrome.zip
          if-no-files-found: ignore

      - name: Upload Firefox build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-build
          path: dist/alterlab-connect-firefox.zip
          if-no-files-found: ignore
