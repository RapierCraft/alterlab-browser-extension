name: Release

# Builds both browser packages, tags and releases them, then submits them to the
# Chrome Web Store and Firefox Add-ons. Every store step fails the run when the
# store does not accept the upload: a green run means the stores accepted it.
# Dispatched by hand or by the AlterLab monorepo's ecosystem release after a
# production deploy (it mirrors the extension source into this repo first).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be MAJOR.MINOR.PATCH"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and parity tests
        run: npm run test:unit

      - name: Stamp version
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - name: Build both browsers
        run: npm run build

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chrome-extension/manifest.json firefox-extension/manifest.json package.json
          git diff --cached --quiet || git commit -m "release: v${{ inputs.version }} [skip ci]"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:main --tags

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            dist/alterlab-connect-chrome.zip
            dist/alterlab-connect-firefox.zip
            dist/firefox/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/alterlab-connect-chrome.zip
            dist/alterlab-connect-firefox.zip

  publish-chrome:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.CWS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Chrome Web Store credentials
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/cws-preflight.mjs

      # chrome-webstore-upload-cli 4.x talks to the Chrome Web Store v2 API and exits
      # non-zero when the upload or the publish request is not accepted.
      - name: Upload and publish to the Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          npx --yes chrome-webstore-upload-cli@4.0.2 \
            --source dist/alterlab-connect-chrome.zip \
            --extension-id "$EXTENSION_ID"
          echo "Chrome Web Store accepted v${{ inputs.version }} (publish requested; Google review follows)." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Listing: https://chromewebstore.google.com/detail/$EXTENSION_ID" >> "$GITHUB_STEP_SUMMARY"

  publish-firefox:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.AMO_ENABLED == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit to Firefox Add-ons (listed channel)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@10.8.0 sign \
            --source-dir dist/firefox/ \
            --artifacts-dir dist/signed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --channel listed \
            --approval-timeout 0
